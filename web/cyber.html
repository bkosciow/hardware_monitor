<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060e" id="metaTheme">
<title>SYNTH//MONITOR</title>
<style>
* { box-sizing: border-box; }

:root, [data-theme="dark"] {
  --bg: #05060e;
  --card: #0b0e1a;
  --card-edge: rgba(0, 240, 255, .28);
  --text: #d8f6ff;
  --muted: #5d7a94;
  --track: rgba(0, 240, 255, .08);
  --overlay: rgba(3, 4, 10, .66);
  --accent: #00f0ff;
  --accent2: #ff2a6b;
  /* temp: <=40 | <=60 | <=80 | 81+ */
  /* util: <=30 | <=60 | <=85 | 86+ */
  /* disk free: >50 | >25 | >10 | <=10 */
  --c0: #00f0ff;
  --c1: #ffe600;
  --c2: #ff6b1a;
  --c3: #ff2a6b;
  --glow: 0 0 10px;
}
[data-theme="light"] {
  --bg: #e9e7e0;
  --card: #f6f5f0;
  --card-edge: rgba(0, 110, 130, .35);
  --text: #10161f;
  --muted: #5a6a7a;
  --track: rgba(0, 110, 130, .12);
  --overlay: rgba(30, 35, 45, .35);
  --accent: #007a8c;
  --accent2: #c2184f;
  --c0: #007a8c;
  --c1: #8a7a00;
  --c2: #b34700;
  --c3: #c2184f;
  --glow: 0 0 6px;
}

html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--bg);
  color: var(--text);
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  transition: background-color .25s ease, color .25s ease;
}
/* dark: neon grid + scanlines */
[data-theme="dark"] body {
  background-image:
    linear-gradient(rgba(0, 240, 255, .04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, .04) 1px, transparent 1px),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px);
  background-size: 44px 44px, 44px 44px, auto;
}
[data-theme="dark"] body::after {
  /* scanline sweep */
  content: "";
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  background: linear-gradient(180deg, transparent 0%, rgba(0, 240, 255, .05) 50%, transparent 100%);
  background-size: 100% 220px;
  animation: sweep 9s linear infinite;
}
@keyframes sweep { from { background-position: 0 -220px; } to { background-position: 0 100vh; } }

/* ---------------------------------------------------------------- header */
.top {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(6px + env(safe-area-inset-top)) 12px 7px;
  background: var(--bg);
  border-bottom: 1px solid var(--card-edge);
  transition: background-color .25s ease;
}
.live { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dot { width: 9px; height: 9px; background: var(--c3); flex: none; }
.dot.online { background: var(--c0); box-shadow: var(--glow) currentColor; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.live-col { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
#clock {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .06em;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  text-shadow: 1px 0 rgba(0, 240, 255, .55), -1px 0 rgba(255, 42, 107, .55);
}
[data-theme="light"] #clock { text-shadow: none; }
#status {
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#status b { font-weight: 700; }
#status.ok b { color: var(--c0); }
#status.lost b { color: var(--c3); animation: pulse 1.6s ease-in-out infinite; }

.actions { display: flex; gap: 4px; }
.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}
.icon-btn:active { background: var(--track); color: var(--text); }
.icon-btn svg { width: 20px; height: 20px; }
.top .icon-btn { width: 34px; height: 34px; }
.top .icon-btn svg { width: 18px; height: 18px; }

/* ---------------------------------------------------------------- cards */
main {
  max-width: 480px;
  margin: 0 auto;
  padding: 12px 14px calc(28px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--card-edge);
  padding: 6px 8px 7px;
  transition: background-color .25s ease, border-color .25s ease, opacity .3s ease;
}
/* angular corner cuts */
.card::before, .card::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border: 0 solid var(--accent);
  pointer-events: none;
}
.card::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
.card::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
body.offline .card { opacity: .65; }

.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.head-left { min-width: 0; }
.card-head h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
}
.sub {
  margin: 2px 0 0;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.extra { font-size: 12px; color: var(--accent2); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }

/* bars */
.row { display: grid; grid-template-columns: 42px 1fr 58px; align-items: center; gap: 10px; margin-top: 6px; }
.row label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track {
  position: relative;
  height: 14px;
  background: var(--track);
  overflow: hidden;
  border: 1px solid var(--card-edge);
  transition: background-color .25s ease;
}
.fill {
  height: 100%;
  width: 0;
  background: var(--lv, var(--muted));
  background-image: repeating-linear-gradient(90deg, transparent 0 10px, rgba(0, 0, 0, .28) 10px 12px);
  background-size: 24px 100%;
  animation: flow 1.6s linear infinite;
  box-shadow: var(--glow) var(--lv, transparent);
  transition: width .5s ease, background-color .5s ease;
}
@keyframes flow { from { background-position: 0 0; } to { background-position: 24px 0; } }
.value {
  font-size: 13px;
  font-weight: 700;
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  color: var(--lv, var(--text));
  text-shadow: var(--glow) currentColor;
}
[data-theme="light"] .value { text-shadow: none; }
.lv0 { --lv: var(--c0); }
.lv1 { --lv: var(--c1); }
.lv2 { --lv: var(--c2); }
.lv3 { --lv: var(--c3); }

/* ---------------------------------------------------------------- sheet */
.backdrop {
  position: fixed;
  inset: 0;
  z-index: 9;
  background: var(--overlay);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  max-width: 480px;
  margin: 0 auto;
  background: var(--card);
  border-top: 2px solid var(--accent);
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(105%);
  transition: transform .25s ease;
}
.sheet.show { transform: translateY(0); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.sheet-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-top: 1px solid var(--card-edge);
}
.set-label { font-size: 14px; }
.ctl { display: flex; align-items: center; }
#intervalInput {
  width: 76px;
  font-size: 16px;
  text-align: right;
  background: var(--track);
  color: var(--text);
  border: 1px solid var(--card-edge);
  padding: 7px 9px;
  font-variant-numeric: tabular-nums;
}
.unit { color: var(--muted); font-size: 14px; margin-left: 6px; }
.seg { display: flex; gap: 3px; background: var(--track); padding: 3px; }
.seg button {
  min-width: 78px;
  padding: 8px 14px;
  font-size: 14px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.seg button.active { background: var(--bg); color: var(--accent); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .fill, .dot.online, #status.lost b, [data-theme="dark"] body::after { transition: none; animation: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="live">
    <span class="dot" id="dot"></span>
    <div class="live-col">
      <time id="clock">--:--:--</time>
      <div id="status">SYNTH//MONITOR<b id="sysmsg"> · OFFLINE</b></div>
    </div>
  </div>
  <div class="actions">
    <button class="icon-btn" id="backBtn" aria-label="Main dashboard"></button>
    <button class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
  </div>
</header>

<main id="cards"></main>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="sheet-head">
    <h2>Config</h2>
    <button class="icon-btn" id="closeBtn" aria-label="Close"></button>
  </div>
  <div class="set-row">
    <span class="set-label">Refresh interval</span>
    <span class="ctl"><input id="intervalInput" type="number" min="1" max="3600" step="1" inputmode="numeric"><span class="unit">s</span></span>
  </div>
  <div class="set-row">
    <span class="set-label">Theme</span>
    <span class="seg" id="themeSeg">
      <button type="button" data-t="dark">Dark</button>
      <button type="button" data-t="light">Light</button>
    </span>
  </div>
</section>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const K = { theme: 'cyber.theme', interval: 'cyber.interval' };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  const ICONS = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4A8.5 8.5 0 1 1 10.6 3.4a7 7 0 0 0 10 10z"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  };
  $('backBtn').innerHTML = ICONS.back;
  $('settingsBtn').innerHTML = ICONS.gear;
  $('closeBtn').innerHTML = ICONS.close;

  /* ------------------------------------------------------------ theme */
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    $('metaTheme').setAttribute('content', t === 'dark' ? '#05060e' : '#e9e7e0');
    $('themeBtn').innerHTML = t === 'dark' ? ICONS.sun : ICONS.moon;
    document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    store.set(K.theme, t);
  }
  $('backBtn').addEventListener('click', () => { window.location.href = '/'; });
  $('themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
  document.querySelectorAll('#themeSeg button').forEach(b => {
    b.addEventListener('click', () => applyTheme(b.dataset.t));
  });

  /* ------------------------------------------------- settings sheet */
  const sheet = $('sheet'), backdrop = $('backdrop');
  function openSheet() { sheet.classList.add('show'); backdrop.classList.add('show'); }
  function closeSheet() { sheet.classList.remove('show'); backdrop.classList.remove('show'); }
  $('settingsBtn').addEventListener('click', openSheet);
  $('closeBtn').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  /* ------------------------------------------------ refresh interval */
  const DEFAULT_INTERVAL = 2;
  function getInterval() {
    const v = parseFloat(store.get(K.interval));
    return Number.isFinite(v) && v >= 1 ? Math.min(3600, Math.round(v)) : DEFAULT_INTERVAL;
  }
  const intervalInput = $('intervalInput');
  intervalInput.value = getInterval();
  intervalInput.addEventListener('change', () => {
    let v = parseFloat(intervalInput.value);
    if (!Number.isFinite(v) || v < 1) v = DEFAULT_INTERVAL;
    v = Math.min(3600, Math.round(v));
    store.set(K.interval, String(v));
    intervalInput.value = v;
    startTimer();
  });

  /* ----------------------------------------------------------- clock */
  const clockEl = $('clock');
  function tickClock() {
    const d = new Date();
    clockEl.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(n => String(n).padStart(2, '0')).join(':');
  }
  setInterval(tickClock, 1000);
  tickClock();

  /* ----------------------------------------------------------- render */
  const cardsEl = $('cards'), dotEl = $('dot'), statusEl = $('status'), sysmsgEl = $('sysmsg');

  const clampPct = (v) => (Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 0);
  const lvlTemp = (t) => (t == null ? null : t <= 40 ? 0 : t <= 60 ? 1 : t <= 80 ? 2 : 3);
  const lvlUtil = (u) => (u == null ? null : u <= 30 ? 0 : u <= 60 ? 1 : u <= 85 ? 2 : 3);
  const lvlFree = (p) => (p == null ? null : p > 50 ? 0 : p > 25 ? 1 : p > 10 ? 2 : 3);
  const fmtPct = (v) => (Number.isFinite(v) ? `${Math.round(v * 10) / 10}%` : '—');
  const gbs = (mib) => (mib == null ? '—' : `${Math.round((mib / 1024) * 10) / 10} GB`);
  const fmtW = (v) => (!Number.isFinite(v) ? '—' : String(Math.round(v * 10) / 10).replace(/\.0$/, ''));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  const mountLabel = (p) => (p === '/' ? 'ROOT' : String(p).split('/').filter(Boolean).pop() || p);

  function rowHtml(r) {
    const lv = r.level == null ? '' : ` lv${r.level}`;
    return `<div class="row">
      <label>${r.label}</label>
      <div class="track"><div class="fill${lv}" data-fill="${r.id}" style="width:${clampPct(r.pct)}%"></div></div>
      <span class="value${lv}" data-value="${r.id}">${r.text}</span>
    </div>`;
  }

  function cardHtml(id, title, sub, extraLines, rows) {
    return `<section class="card">
      <div class="card-head">
        <div class="head-left"><h2>${esc(title)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>
        <span class="extra" data-extra="${id}">${extraLines.map(esc).join('<br>')}</span>
      </div>
      ${rows.map(rowHtml).join('')}
    </section>`;
  }

  function extraOf(s) {
    const out = {};
    const cpu = s.cpu || {};
    const ram = s.ram || {};
    const pcLines = [];
    if (cpu.temperature_c != null) pcLines.push(`${cpu.temperature_c} °C`);
    if (ram.total_mib) pcLines.push(`${gbs(ram.used_mib)} / ${gbs(ram.total_mib)}`);
    out['pc'] = pcLines;
    (s.gpus || []).forEach((g, i) => {
      const lines = [];
      if (g.vram_used_mib != null && g.vram_total_mib) lines.push(`${gbs(g.vram_used_mib)} / ${gbs(g.vram_total_mib)}`);
      if (g.power_current_w != null || g.power_max_w != null) lines.push(`${fmtW(g.power_current_w)} / ${fmtW(g.power_max_w)} W`);
      out[`gpu${i}`] = lines;
    });
    return out;
  }

  function rowsOf(s) {
    const rows = [];
    const cpu = s.cpu || {};
    rows.push({ id: 'cpu-util', label: 'PROC', text: fmtPct(cpu.utilization_pct), level: lvlUtil(cpu.utilization_pct), pct: cpu.utilization_pct });
    const ram = s.ram || {};
    const rp = ram.total_mib ? (ram.used_mib / ram.total_mib) * 100 : null;
    rows.push({ id: 'ram-used', label: 'MEM', text: fmtPct(rp), level: lvlUtil(rp), pct: rp });
    (s.disks || []).forEach((d, i) => {
      const fp = d.total_mib ? (d.free_mib / d.total_mib) * 100 : null;
      rows.push({ id: `d${i}-free`, label: mountLabel(d.path), text: gbs(d.free_mib), level: lvlFree(fp), pct: fp });
    });
    (s.gpus || []).forEach((g, i) => {
      rows.push({ id: `g${i}-temp`, label: 'THERM', text: g.temperature_c == null ? '—' : `${g.temperature_c} °C`, level: lvlTemp(g.temperature_c), pct: g.temperature_c });
      rows.push({ id: `g${i}-util`, label: 'LOAD', text: fmtPct(g.utilization_pct), level: lvlUtil(g.utilization_pct), pct: g.utilization_pct });
    });
    return rows;
  }

  function buildAll(s) {
    const cpu = s.cpu || {};
    const extras = extraOf(s);
    const rows = rowsOf(s);
    const diskStart = 2 + (s.disks || []).length;
    let html = cardHtml('pc', 'CPU // Core', cpu.name || '', extras['pc'], rows.slice(0, diskStart));
    (s.gpus || []).forEach((g, i) => {
      html += cardHtml(`gpu${i}`, `GPU_${String(i + 1).padStart(2, '0')} // Deck`, g.name || '', extras[`gpu${i}`], rows.slice(diskStart + i * 2, diskStart + 2 + i * 2));
    });
    cardsEl.innerHTML = html;
  }

  function updateRows(s) {
    const extras = extraOf(s);
    for (const id in extras) {
      const el = cardsEl.querySelector(`[data-extra="${id}"]`);
      if (el) el.innerHTML = extras[id].map(esc).join('<br>');
    }
    for (const r of rowsOf(s)) {
      const fill = cardsEl.querySelector(`[data-fill="${r.id}"]`);
      const val = cardsEl.querySelector(`[data-value="${r.id}"]`);
      if (!fill || !val) continue;
      fill.style.width = clampPct(r.pct) + '%';
      for (const el of [fill, val]) {
        el.classList.remove('lv0', 'lv1', 'lv2', 'lv3');
        if (r.level != null) el.classList.add(`lv${r.level}`);
      }
      val.textContent = r.text;
    }
  }

  let lastSig = '';
  function render(s) {
    const sig = (s.gpus || []).map(g => `${g.vendor}|${g.name || ''}|${g.vram_used_mib != null ? 'v' : ''}${g.power_current_w != null ? 'p' : ''}`).join(';') + '#' + ((s.cpu && s.cpu.name) || '') + '#' + (s.disks || []).map(d => d.path).join(',');
    if (sig !== lastSig) { buildAll(s); lastSig = sig; }
    else { updateRows(s); }
    setOnline(true);
  }

  /* ----------------------------------------------------------- polling */
  function setOnline(v) {
    dotEl.classList.toggle('online', v);
    document.body.classList.toggle('offline', !v);
    statusEl.classList.toggle('ok', v);
    statusEl.classList.toggle('lost', !v);
    sysmsgEl.textContent = v ? ' · UPLINK STABLE' : ' · SIGNAL LOST';
  }

  let inflight = false;
  async function tick() {
    if (inflight) return;
    inflight = true;
    try {
      const r = await fetch('/stats', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
    } catch (e) {
      setOnline(false);
    } finally {
      inflight = false;
    }
  }

  let timer = null;
  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, getInterval() * 1000);
  }

  /* ------------------------------------------------------------- init */
  applyTheme(store.get(K.theme) === 'light' ? 'light' : 'dark');
  startTimer();
  tick();
})();
</script>
</body>
</html>
